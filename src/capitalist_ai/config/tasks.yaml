final_summary_task:
  description: >
    1. Define and document the GLEE metrics for the company, summarizing responses from the other bots. Do not infer or create any new strategy or ideas.
    2. Rank and document the GEM (Growth, Engagement, Monetization) priorities, including the **Chief Strategy Bot’s reasoning** for each.
    3. Incorporate the **Feature Prioritization Table** from the Feature Scoring Bot (FSB), ensuring clarity on scoring methodology and formula usage.
    4. Capture and summarize the **Complexity Scores** from the Senior Engineering Manager Bot (RCB) to provide visibility into effort constraints.
    5. Identify and highlight key **strategic insights and next steps** based on the interactions between bots.
    6. Format all findings into a **clean, well-structured document** with clear sections and headings
  expected_output: >
    A structured executive summary document containing:
    - GLEE strategies
    - GEM ranking (including reasoning from the chief strategy officer)
    - Priority metrics used
    - Feature priortisation table from the feature scoring bot
    - Strategic insights and next steps
      - **[Key themes emerging from the market]**
      - **[potential risks and trade-offs]**
      - **[recommendations for next steps for the product leadership]**
  agent: pmb
  output_file: final_summary_task.md
  context: [chief_strategy_task, feature_scoring_task]  

quality_assurance_task:
  description: >
    Quality check the final response given by the Senior Product Manager L3 (PMB)
  expected_output: >
    A final response ready to be sent out. This response should consolidate the final strategy plan for the customer, incorporating all relevant feedback and information.
    This response should also include a table with detailed metrics definition for each item in the product backlog that you got from the VP of Product Management.
  agent: qab
  output_file: quality_assurance_task.md

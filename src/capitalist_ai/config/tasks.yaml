market_research_task:
  description: >
    Analyze competitor data and industry reports to extract trends and key gaps for the business defined in the {positioning} doc.
  expected_output: >
    A report summarizing competitor strengths, industry trends, and key market gaps in {positioning} doc.
  agent: mrb
  output_file: market_research_task.md

metrics_analyzer_task:
  description: >
    Review financial and KPI documents to identify weak GEM pillars and impact areas for Business defined in the {positioning} doc.
  expected_output: >
    A breakdown of financial performance, KPI trends, and weak GEM pillars affecting business.
  agent: mab
  output_file: metrics_analyzer_task.md

chief_strategy_task:
  description: >
    Using insights from MRB and MAB, define high-level GLEE, GEM, and DHM strategic goals for the business mentioned in {positioning}.
  expected_output: >
    Define GLEE, GEM, and DHM using the exact definitions from the document.
    Develop a strategy for {website} based on these models.
    Rank the company’s priorities (Growth, Engagement, Monetization) and set proxy metrics for GEM.
    Ensure all responses align 100% with the document, with no external interpretation.
  agent: csb
  output_file: chief_strategy_task.md
  context: [market_research_task, metrics_analyzer_task]

feature_scoring_task:
  description: >
    Evaluate feature ideas mentioned in the {productbacklog} using GEM and DHM frameworks, prioritizing features based on business impact and feasibility.
  expected_output: >
    tasks: >
    1. Analyze all 'under consideration' and 'planned' backlog items ({productbacklog}) to determine alignment with immediate business goals.
    2. Assign GEM (Growth, Engagement, Monetization) and DHM (Delight, Hard-to-Copy, Margin-Enhancing) scores to each feature.
    3. Collect effort scores from RCB (Senior Engineering Manager) and integrate them into the prioritization model.
    4. Compute a final prioritization score using a weighted formula based on GEM, DHM, and complexity.
    5. Generate and communicate the prioritized backlog, ensuring alignment with the Chief Strategy Officer’s vision.
  expected_output: >
    A structured **table** with the following columns:
    - **Feature Name**: Name of the feature being evaluated.
    - **GEM Scores**: Growth, Engagement, Monetization scores (individually listed).
    - **DHM Scores**: Delight, Hard-to-Copy, Margin-Enhancing scores (individually listed).
    - **Complexity Score**: The effort score received from RCB.
    - **Weightage Used**: The applied weight for each metric based on the business's strategic focus.
    - **Final Prioritization Score**: Computed score using a clear formula that includes GEM, DHM, and complexity.
    - **Formula Breakdown**: Explanation of how the final score was computed.
    - **Justification**: Short reasoning for why the prioritization decision was made.

    Example Output:
    ```
    | Feature Name       | Growth | Engagement | Monetization | Delight | Hard-to-Copy | Margin-Enhancing | Complexity | Weightage Used | Final Score | Formula Used | Justification |
    |--------------------|--------|------------|--------------|---------|-------------|----------------|------------|---------------|-------------|--------------|--------------|
    | AI Video Editing  |  4.5   |     4.2    |     3.8      |   5.0   |     4.8     |      4.2       |     3      | 40/30/30      |    4.12     | (0.4*GEM) + (0.3*DHM) - (0.3*Complexity) | Aligns with engagement goals |
    ```
  agent: fsb
  output_file: feature_scoring_task.md
  context: [chief_strategy_task]

reality_check_task:
  description: >
    Assess the feasibility of the prioritized feature backlog, identifying any engineering constraints.
  expected_output: >
    TA structured **table** with the following columns:
    - **Feature Name**: Name of the feature being evaluated.
    - **Code Complexity**: How difficult the implementation is from a code perspective.
    - **System Dependencies**: Any core system changes, integrations, or API requirements.
    - **Scalability Concerns**: Any performance impact or load considerations.
    - **Security Risks**: Any data compliance or regulatory challenges.
    - **Testing Overhead**: Level of effort required for testing and QA.
    - **Collaboration Required**: Whether this feature requires input from other teams.
    - **Final Complexity Score**: A numeric score (1, 2, 3, 5, or 8) summarizing overall effort.
    - **Justification**: Short reasoning for why the complexity score was assigned.

    Example Output:
    ```
    | Feature Name       | Code Complexity | System Dependencies | Scalability Concerns | Security Risks | Testing Overhead | Collaboration Required | Final Complexity Score | Justification |
    |--------------------|----------------|----------------------|----------------------|---------------|-----------------|----------------------|----------------------|--------------|
    | AI Video Editing  | High           | API + Backend Change | High                 | Low           | Extensive        | Backend + Infra      | 5                    | Requires real-time processing |
    ```
  agent: rcb
  output_file: reality_check_task.md
  context: [feature_scoring_task]


final_summary_task:
  description: >
    1. Define and document the **GLEe strategies for each phase (Get Big, Lead, Expand) for the company**, summarizing responses from the other bots. Do not infer or create any new strategy or ideas.
    2. Rank and document the GEM (Growth, Engagement, Monetization) priorities, including the **Chief Strategy Bot's reasoning** for each.
    3. Incorporate the **Feature Prioritization Table** from the Feature Scoring Bot (FSB), ensuring clarity on scoring methodology and formula usage.
    4. Incorporate and summarize the **key findings from the Reality Check Task**, including **Complexity Scores from the Senior Engineering Manager Bot (RCB) and product/market fit considerations from the Senior Product Manager (L2).** Provide visibility into effort constraints and potential market adoption concerns.
    5. Identify and highlight key **strategic insights and next steps** based on the interactions between bots.
    6. Format all findings into a **clean, well-structured document** with clear sections and headings
  expected_output: >
    A structured executive summary document containing:
    - **GLEe Strategies (Get Big, Lead, Expand)**
    - GEM ranking (including reasoning from the chief strategy officer)
    - Priority metrics used
    - Feature priortisation table from the feature scoring bot
    - Strategic insights and next steps:
      - **[Key themes emerging from the market research and competitive analysis (source: Market Research Task output)]**
      - **[Potential risks and trade-offs identified in metrics analysis (source: Metrics Analyzer Task output) and reality checks (source: Reality Check Task output)]**
      - **[Clear recommendations for next steps for the product leadership team, aligned with the overall strategic direction (source: Chief Strategy Task output) and feasibility assessments (source: Reality Check Task output)]**
  agent: pmb
  output_file: final_summary_task.md
  context: [market_research_task, metrics_analyzer_task, chief_strategy_task, feature_scoring_task, reality_check_task]

quality_assurance_task:
  description: >
    Perform a quality check on the final product strategy document generated by the Senior Product Manager L3 (PMB), ensuring strategic soundness, logical consistency, and framework compliance.
  expected_output: >
    A Quality Assurance Report that assesses the final product strategy document generated by the Senior Product Manager L3 (PMB). This report should evaluate:
    - Strategic Soundness: Does the strategy align with overall business objectives and market context?
    - Logical Consistency: Are the recommendations internally consistent and well-reasoned?
    - Framework Compliance: Does the strategy correctly and consistently apply the GLEe, GEM, and DHM frameworks?
    - Completeness: Does the document include all the required sections (GLEe Strategies, GEM Ranking, Priority Metrics, Feature Prioritization Table, Strategic Insights & Next Steps)?
    - Clarity and Structure: Is the document well-formatted, clear, and easy to understand for product leadership?

    The QA report should provide a concise summary of findings and highlight any areas needing improvement in the PMB's strategy document.
  agent: qab
  output_file: quality_assurance_task.md